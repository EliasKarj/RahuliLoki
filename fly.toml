# Fly.io deployment.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create what_remains_data --size 1 --region arn
#   fly secrets set POESESSID=… POE_ACCOUNT_NAME='Exile#1234' POE_LEAGUE=Settlers \
#     AUTH_TOKEN="$(openssl rand -hex 32)"
#   fly deploy
#
# POESESSID goes in `fly secrets`, never in this file — it is a full account credential and
# this file is committed.
#
# AUTH_TOKEN is not optional here. [http_service] publishes this app to the public internet,
# where an unauthenticated API means the account's full wealth history is readable by anyone
# who finds the hostname, and POST /api/poll lets them spend its GGG rate-limit budget. The
# server refuses to boot on a public bind without it — that refusal is the feature, so do not
# reach for ALLOW_UNAUTHENTICATED to silence it.

app = 'what-remains'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  # Fly terminates TLS at its proxy and forwards X-Forwarded-*, so those headers can be
  # believed here — and only here. Left off by default, since anywhere else they are
  # client-supplied and would put forged addresses in the logs.
  TRUST_PROXY = '1'
  HOST = '0.0.0.0'
  DATABASE_URL = 'file:/data/what-remains.db'
  POLL_CRON = '*/10 * * * *'
  MIN_ITEM_CHAOS = '2'

[mounts]
  source = 'what_remains_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # The poller is a scheduled background job. A machine that stops when the browser tab closes
  # would simply not collect anything, so this one stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '60s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

# A single machine, deliberately. Two would poll the same account twice and write two
# snapshots per interval, and SQLite on a Fly volume cannot be shared between them anyway.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
