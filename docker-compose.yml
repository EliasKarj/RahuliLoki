# Smallest thing that runs valuuttaloki on a VPS.
#
#   cp .env.example .env   # fill in POESESSID and POE_ACCOUNT_NAME
#   docker compose up -d
#
# The named volume is the only thing worth backing up: it holds every snapshot ever taken.

services:
  valuuttaloki:
    build: .
    image: valuuttaloki:latest
    container_name: valuuttaloki
    # The poller is the point of the app, so it comes back after a reboot or a crash.
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env: inside the container the database always lives on the volume.
      DATABASE_URL: file:/data/valuuttaloki.db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - valuuttaloki-data:/data

volumes:
  valuuttaloki-data:
