name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege. This workflow only reads the checkout — it never comments, tags or pushes —
# while the default token is repo-writable in many configurations. A compromised package in
# `pnpm install` runs with whatever this grants.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated code the server imports; typecheck fails without it.
      - run: pnpm --filter @valuuttaloki/server exec prisma generate

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The migration and the schema must agree. A schema edited without a migration would
      # only fail on somebody's production volume otherwise.
      - name: Check migrations match the schema
        working-directory: server
        env:
          DATABASE_URL: file:./ci.db
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url file:./shadow.db --exit-code

      # A known-vulnerable dependency should fail the build here rather than be discovered on
      # the volume holding a league's history. This app serves an authenticated HTTP surface
      # and holds an account credential, so "moderate" is the right floor.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
