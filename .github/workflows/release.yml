name: Release

# Tag a version and the installers build themselves.
#
#   pnpm version 1.0.1 --no-git-tag-version   # or edit the four package.json files
#   # …and VERSION in server/src/lib/config.ts, which the tests check for you
#   git commit -am 'Release 1.0.1' && git push
#   git tag v1.0.1 && git push origin v1.0.1
#
# The bump is committed *before* the tag, and the tag must name the version the manifests
# already carry. v1.4.1 was cut the other way round — tagged on a tree that still said 1.4.0 —
# and the installers it produced announced themselves by the wrong number. The first job below
# now refuses that build rather than publishing it.
#
# Each platform's installer has to be built on that platform: an NSIS installer needs Windows
# tooling and a dmg needs macOS, and cross-building either from Linux means wine and a stack of
# caveats. A matrix of three runners is the cheap way to have all three be real builds.
on:
  push:
    tags: ['v*']
  # Buildable on demand too, so a broken release can be re-run without inventing a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap, and it runs before three runners spend ten minutes each packaging something that is
  # named wrong. A published release is not recallable: people download it, the update check
  # compares against it, and an installer whose contents disagree with its tag tells every user
  # it is out of date forever.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must be the version the manifests carry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json server/package.json web/package.json desktop/package.json; do
            found=$(node -p "require('./$manifest').version")
            if [ "$found" != "$tag" ]; then
              echo "::error::$manifest says $found but the tag is v$tag."
              echo "::error::Bump the manifests and VERSION in server/src/lib/config.ts, commit, then move the tag."
              exit 1
            fi
          done
          echo "Tag v$tag matches all four manifests."

  build:
    needs: version
    strategy:
      # One platform failing should not throw away the two that worked; the release can be
      # completed by re-running the one that broke.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: What-Remains-windows
          - os: macos-latest
            artifact: What-Remains-macos
          - os: ubuntu-latest
            artifact: What-Remains-linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @whatremains/server exec prisma generate

      # The installer is only worth building if the code in it passes. A release is the worst
      # place to find out that a test was red.
      - run: pnpm typecheck
      - run: pnpm test

      # Builds the dashboard and the server, then packages the shell around them.
      #
      # `--publish never` lives in the package script itself. electron-builder publishes to
      # GitHub Releases on its own the moment it detects CI, and then fails the build asking
      # for a token it should never have been given — the release is assembled once, below,
      # out of all three platforms' artifacts.
      - run: pnpm desktop:package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Installers only. The unpacked directory is half a gigabyte of the same thing.
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only a tag becomes a release. A manual run builds the installers and leaves them as
    # workflow artifacts, which is what "does it still package?" wants and nothing more.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Installers for Windows, macOS and Linux are attached below.

            The database and the stored session live in the per-user application data
            directory, never inside the app, so installing over an existing copy keeps a
            league's history.
